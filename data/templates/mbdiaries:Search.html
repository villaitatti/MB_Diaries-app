<link rel="stylesheet" href="../../assets/mb_diaries.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

[[> mbdiaries:Header ]]

[[#if (urlParam "q")]]

<div id="mb_diaries_search">
  <div class="search-page-wrapper">
    <div class="container">

      <div class="search-header">
        <h1>Search the Diaries</h1>
        <p class="search-subtitle">1891–1937 · Mary Berenson</p>
      </div>

      <div class="search-main-content">

        <!-- Pre-filled form + direct results when ?q= is present -->
        <form class="search-form-container" method="get">
          <input type="hidden" name="uri" value="mbdiaries:Search">
          <div class="search-input-row">
            <input
              type="text"
              name="q"
              value='[[urlParam "q"]]'
              placeholder="Search the diaries…"
              class="search-text-input"
              autocomplete="off"
            >
            <button type="submit" class="search-submit-button">
              <i class="fas fa-search"></i><span>Search</span>
            </button>
          </div>
        </form>

        <semantic-table
          id='table'
          query='
            SELECT ?d ?diary ?page ?stringLabel ?diaryOrder ?pageOrder WHERE {
              ?subject a mbdiaries-ontology:Page;
                  rdf:value ?stringLabel;
                  rdfs:label ?page;
                  mbdiaries-ontology:index ?pageOrder;
                  mbdiaries-ontology:part_of ?d.
              ?d rdfs:label ?diary;
                  mbdiaries-ontology:order ?diaryOrder.
              FILTER(REGEX(?stringLabel, "[[urlParam "q"]]", "i"))
            } ORDER BY ?diaryOrder ?pageOrder'
          tuple-template='{{> table-row}}'>
          <template id="table-row">
              <div class="results-header show-one">
                  <div class="result-column diary-column"><strong>Diary</strong></div>
                  <div class="result-column sequence-column"><strong>Sequence</strong></div>
                  <div class="result-column content-column"><strong>Content</strong></div>
              </div>
              <semantic-link iri="{{d.value}}">
                  <div class="result-row clickable-row">
                      <div class="result-column diary-column">{{diary.value}}</div>
                      <div class="result-column sequence-column">Page {{page.value}}</div>
                      <div class="result-column content-column">{{stringLabel.value}}</div>
                  </div>
              </semantic-link>
          </template>
        </semantic-table>

      </div>
    </div>
  </div>
</div>

[[else]]

<div id="mb_diaries_search">
  <div class="search-page-wrapper">
    <div class="container">

      <div class="search-header">
        <h1>Search the Diaries</h1>
        <p class="search-subtitle">1891–1937 · Mary Berenson</p>
      </div>

      <div class="search-main-content">

        <!-- Empty search form: submit navigates to ?q=term, results shown by the [[if]] branch -->
        <form class="search-form-container" method="get">
          <input type="hidden" name="uri" value="mbdiaries:Search">
          <div class="search-input-row">
            <input
              type="text"
              name="q"
              placeholder='e.g. "Bernhard", "Florence", "London"'
              class="search-text-input"
              autocomplete="off"
            >
            <button type="submit" class="search-submit-button">
              <i class="fas fa-search"></i><span>Search</span>
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

[[/if]]

<style>

  /* ── RS overrides ── */

  }

  semantic-table table,
  semantic-table tbody,

  semantic-table td {
    display: block;

    padding: 0;
    margin: 0;
  }

    display: none;
  }

  .show-one:first-of-type {

  }

  .facet__category-selector-holder {

  }

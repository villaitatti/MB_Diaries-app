<rs-text-annotation-type
  label="Painting"
  rdf-type='https://mbdiaries.itatti.harvard.edu/ontology/Painting'
  color="#317589">

  <template id='annotation'>
    <semantic-query
      query='
        SELECT ?iri ?label ?subtitle ?lod WHERE {
          BIND({{iri}} as ?iri)
          ?iri oa:hasBody ?body .
          ?body owl:sameAs ?wikidata .
          ?wikidata rdfs:label ?label.
          optional{ ?wikidata mbdiaries-ontology:subtitle ?subtitle }
          optional{ ?wikidata owl:sameAs ?lod }
        }'
      template='{{> show}}'>

      <template id='show'>
        {{#> mbdiaries:template}}
          <container-fluid class="person">
            <bs-row>
              <bs-col sm="3" md="3">
                <img class="anno-icon" src="../../assets/icons/frame.svg" alt="Artwork icon">
              </bs-col>
              <bs-col>

                {{#if bindings.0.lod.value}}
                  <h3><a href="{{bindings.0.lod.value}}" target="_blank">{{bindings.0.label.value}}</a></h3>
                {{else}}
                  <h3>{{bindings.0.label.value}}</h3>
                {{/if}}
                  
                <p>{{bindings.0.subtitle.value}}</p>

              </bs-col>
            </bs-row>
          </container-fluid>
        {{/ mbdiaries:template}}
      </template>

    </semantic-query>
  </template>

  <semantic-form-composite-input
    for='oaHasBody'
    new-subject-template='/body'
    fields='[[fieldDefinitions
      classtype               = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/type"
      sameAs_existing         = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/owl_sameAs_existing_painting"
      sameAs_new              = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/owl_sameAs"
    ]]'>
    <semantic-form-hidden-input for='classtype' default-value='https://mbdiaries.itatti.harvard.edu/ontology/Painting'></semantic-form-hidden-input>

    <bs-tabs id="tabs">
      <bs-tab event-key="1" title="Existing Painting">

        <semantic-form-autocomplete-input render-header="false" for='sameAs_existing' placeholder="Search and select a Painting here ...">
        </semantic-form-autocomplete-input>

      </bs-tab>
      <bs-tab event-key="2" title="Create a new Painting">
        <semantic-form-composite-input
          label="Painting"
          render-header="false"
          for='sameAs_new'
          new-subject-template='https://www.wikidata.org/wiki/{{{{raw}}}}{{UUID}}{{{{/raw}}}}'
          fields='[[fieldDefinitions
            classtype             = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/type"
            label                 = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/label"
            subtitle              = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/label_subtitle"
            sameAs                = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/owl_sameAs"
          ]]'
        >
          <semantic-form-text-input for='label' label="Display title" placeholder="Type new Painting title here ..."></semantic-form-text-input>
          <semantic-form-text-input for='subtitle' label="Display author and date" placeholder="Type author and date here ..."></semantic-form-text-input>

          <semantic-form-text-input for='sameAs' label="Linked open data" placeholder="Type URIs (e.g., Hollis permalink, Wikidata ID, etc) here ..."></semantic-form-text-input>

          
        </semantic-form-composite-input>
      </bs-tab>
    </bs-tabs>

    <semantic-form-errors></semantic-form-errors>
  </semantic-form-composite-input>

</rs-text-annotation-type>

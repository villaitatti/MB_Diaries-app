<link rel="stylesheet" href="../../assets/mb_diaries.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<bs-navbar id="mb_diaries_header" class="itatti-navbar navbar navbar-default navbar-fixed-top" role="navigation">
  <div class="rs-header">

    <semantic-link class="nav-logo" iri="mbdiaries:diaries">
      <div class="nav-logo-text">
        <span class="nav-logo-title">The Mary Berenson Diaries</span>
        <span class="nav-logo-subtitle">1891–1937</span>
      </div>
    </semantic-link>

    <bs-navbar-collapse class="pull-right">
      <bs-nav>
        <bs-nav-item>
          <semantic-link iri="mbdiaries:diaries">Diaries</semantic-link>
        </bs-nav-item>
      </bs-nav>

      <form class="mb-navbar-search-form">
        <input type="hidden" name="uri" value="mbdiaries:Search">
        <div class="mb-navbar-search-wrapper">
          <input
            type="text"
            name="q"
            class="mb-navbar-search-input"
            placeholder="SEARCH THE DIARIES…"
            autocomplete="off"
          >
          <button type="submit" class="mb-navbar-search-btn" aria-label="Search">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </form>
    </bs-navbar-collapse>

  </div>
</bs-navbar>

<rs-text-annotation-type
  label="Person"
  rdf-type='https://mbdiaries.itatti.harvard.edu/ontology/Person'
  icon-url='../../assets/icons/actor.svg'
  color="#4B77BE">

  <template id='annotation'>
    <semantic-query
      query='
        SELECT ?iri ?label WHERE {
          BIND({{iri}} as ?iri)
          ?iri oa:hasBody ?body .
          ?body owl:sameAs ?wikidata .
          ?wikidata rdfs:label ?label .
        }'
      template='{{> show}}'>

      <template id='show'>
        {{#> mbdiaries:template}}
          <div class="dpub-annotation-content person">
            <semantic-link iri="{{iri.value}}">
              <strong>{{bindings.0.label.value}}</strong>
            </semantic-link>
          </div>
        {{/ mbdiaries:template}}
      </template>

    </semantic-query>
  </template>


  <semantic-form-composite-input
    for='oaHasBody'
    new-subject-template='/body'
    fields='[[fieldDefinitions
      classtype               = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/type"
      sameAs_existing         = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/owl_sameAs_existing_person"
      sameAs_new              = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/owl_sameAs_new_person"
    ]]'>
    <semantic-form-hidden-input for='classtype' default-value='https://mbdiaries.itatti.harvard.edu/ontology/Person'></semantic-form-hidden-input>

    <bs-tabs id="tabs">
      <bs-tab event-key="1" title="Existing Person">

        <semantic-form-autocomplete-input label="Person" for='sameAs_existing' placeholder="Search and select a Person here ...">
        </semantic-form-autocomplete-input>

      </bs-tab>
      <bs-tab event-key="2" title="Create a new Person">
        <semantic-form-composite-input
          label="Person"
          for='sameAs_new'
          new-subject-template='https://www.wikidata.org/wiki/{{{{raw}}}}{{UUID}}{{{{/raw}}}}'
          fields='[[fieldDefinitions
            classtype             = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/type"
            label                 = "https://collection.itatti.harvard.edu/fieldDefinitionContainer/label"
          ]]'
        >
          <semantic-form-text-input for='label' render-header="false" placeholder="Type new person label here ..."></semantic-form-text-input>
          
        </semantic-form-composite-input>
      </bs-tab>
    </bs-tabs>
              




    <semantic-form-errors></semantic-form-errors>
  </semantic-form-composite-input>

</rs-text-annotation-type>

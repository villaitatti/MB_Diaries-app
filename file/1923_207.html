		<h3>Saturday, July 14, 1923</h3>
		<p>Chilling</p>
		<p>Britten, Karin</p>
		<p>Heavy and hot</p>
		<p>Karin arrived, poor child, with her head still bandaged. She looked fearfully dirty and untidy, no time to attend to herself, but I fear also no standards. But she’s always interesting.</p>

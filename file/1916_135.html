		<h3>Monday, May 29, 1916, Naples</h3>
		<p>Geoffrey Scott, Nora Grifeo</p>
		<p>Saw Ravello in the morning the pulpits and the head in the Duomo and the pulpit which hasn’t plates in S. Giovanni Taro.</p>
		<p>Came back around Vesuvius - a much nice way.</p>
		<p>Nora very attractive.</p>

		<h3>Monday, August 7, 1933, Consuma</h3>
		<p>Clotilde</p>
		<p>Heavenly</p>
		<p>Convalescent – but feeble. Did not try to walk.</p>
		<p>Wrote to Lord Duveen</p>
		<h3>Tuesday, August 8, 1933, Consuma</h3>
		<p>Hot. Rainstorm</p>
		<p>Feeling better but not up for walking. Pellegrina came for the night. Her cousin Dr. Lega, who brought her, stayed to lunch.</p>

		<h3>Sunday, February 25, 1934</h3>
		<p>Rain</p>
		<p>Naima</p>
		<p>Went w. Shapley’s to see their little girls at Poggio Imperiale and then took the So [tram? Bus?] to call on Olga Loeser. In the evng we finished “Flush” wh. BB did not care much for. I liked it quite well.</p>

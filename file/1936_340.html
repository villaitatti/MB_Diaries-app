		<p>Tuesday, November 17, 1936</p>
		<p>Beautiful</p>
		<p>Naima</p>
		<p>BB and Nicky got home for tea, not tired, for the “Rome-Express” is a splendid train.</p>
		<p>It was perfectly delightful to see them!</p>
		<p>Roger ailing. Fainted twice, but played very merrily in between the faints. Perhaps teeth.</p>

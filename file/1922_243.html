		<p>Monday, August 7, 1922</p>
		<p>Our last day. We dined with Doktor Hofrath Leusser and his wife, wonderful food, but that stiff German middle-class dulness [<i>sic</i>]. However, it had to be done.</p>
		<p>Teacher: Frau Frick</p>
		<p>12 Prinz Regenten Strasse</p>
		<p>Kissingen</p>

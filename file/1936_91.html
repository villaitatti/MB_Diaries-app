		<h3>Friday, 13 March, 1936</h3>
		<p>A simply awful day. Could not even read.</p>
		<p>But Roger has learnt to climb on one of my easy chairs. He gets up and then tramples and looks very self-satisfied and then calls on us for admiration. What should I do without him?</p>

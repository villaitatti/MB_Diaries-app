		<p><b>Saturday, May 22, 1926</b></p>
		<p>Fine</p>
		<p>Saw the 3 Serpotta oratorios with Signorina <u>Acascina</u> and Dott. <u>Lavasini</u> and also the <u>Martorana</u>.  Dined at <u>Castelmanigis;</u> a most horrible dinner but host and hostess pleasant. The Turkish Consul was there.</p>

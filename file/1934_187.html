		<p>Tuesday, June 19, 1934, London</p>
		<p>Cooler. Rain</p>
		<p>Desmond to breakfast. Lunched w. Witts who had Herbert Reid and the Byam Shaws. Sir Charles Holmes was there, very cringing. The Witts bounded. Reid said nary a word. Went on to Karin’s. Tired.</p>
		<p>Remembered 4 more dead. (1445)</p>

		<p>Wednesday, June 7, 1922</p>
		<p>{<i>straddling both pages</i>} I Tatti</p>
		<p>Acute cystitis!!</p>
		<p>But I saw Geoffrey for a little while on my loggia, where I have a bed.</p>
		<p>BB and Ralph had tea with Miss Paget.</p>
		<p>The Salveminis came to dine</p>

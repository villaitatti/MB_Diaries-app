		<p>Tuesday, April 11, 1922</p>
		<p>Cairo</p>
		<p>The others went to Alexandria with Creswell.</p>
		<p>I was able to go out and <u>have</u> a last diathermy treatment for my neuralgia, which came on again with this fever.</p>
		<p>Alfred and Patricolo and Mrs. Devonshire called.</p>

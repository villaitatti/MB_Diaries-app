		<h3>Thursday, Oct. 10, 1907</h3>
		<p>Fine.</p>
		<p>Scott, Rothenstein, Maud Cruttwell.</p>
		<p>Maud came up. B.B. and Rothenstein dined with Mrs. Ross, so we had her to ourselves. Scott meant to dress up as a Spanish lady, but our courage failed us. Maud is too gross.</p>

		<h3>Tuesday, Aug. 4, 1908</h3>
		<p>Iffley.</p>
		<p>Fine warm weather.</p>
		<p>Trevy, Marjorie Strachey, Billy, Rukhmabai.</p>
		<p>Trevy left.</p>
		<p>Went in to see galleries with Sirèn and Billy.</p>
		<p>Sirèn came to lunch and dinner.</p>
		<p>We swam and looked at photographs and talked with Sirèn about “The Purple Mother” whose disciple he is.</p>

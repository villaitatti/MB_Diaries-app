		<h3>Saturday, February 24, 1934</h3>
		<p>Scirocco</p>
		<p>Naima</p>
		<p>Benedetto Croce and daughter, Prof. Russo, Pancrazi lunched here. Good talk.</p>
		<p>Mr. and Mrs. Osbourne called. He is a painter and v. intelligent, she seems a goose.</p>
		<p>Read Virginia Woolfs “Flush” aloud in evng.</p>

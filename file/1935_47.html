		<h3>Wednesday, January 30, 1935, I Tatti</h3>
		<p>Fine</p>
		<p>Trevy</p>
		<p>Read to Fern the Preface to our “sacred Pictures” she e and him had tea</p>
		<p>I am better but often feel worn. So tired!</p>
		<h3>January 23</h3>
		<p>Villa Doccia and its problem kept me awake for too much in the night.</p>
		<p>Still I am even so much better</p>

		<h3>Wednesday, May 16, 1934</h3>
		<p>St. Leonard’s Terrace S.W. 3</p>
		<p>Paris arriving at 9.45. Took the “Silver Wing” airplane and reached Alys’ at 3.30 just 24 hours from Florence. Elizabeth crossed by boat w. my trunk.</p>
		<p>Ray and Karin came to dine, both looking very well. Alys and Logan ditto.</p>

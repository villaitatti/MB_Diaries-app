		<h3>Monday, July 30, 1923</h3>
		<p>Chilling</p>
		<p>Children</p>
		<p>Berticella</p>
		<p>Cloudy</p>
		<p>Last day-- alas. It has been nice! Barbara felt a little ill in the night, so she came and slept in my bed, and though I did not sleep I enjoyed feeling her little slim warm body beside me.</p>

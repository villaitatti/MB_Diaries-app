		<h3>Sunday, January 24, 1937, I Tatti</h3>
		<p>Rainy</p>
		<p>Trevy Morra</p>
		<p>The Kuhens arrived at 6.30; Byba very much exhausted and ill went straight to bed.</p>
		<p>Aurel Stein called. He said very nice thing about my “Modern Pilgrimage”</p>
		<p>Dead Diego Angeli Clare Sheridan’s son and I forgot Lonty “Berticelli” (1981)</p>

		<p>Jan. 12 Friday, 1934 La Pellegrina. San Remo</p>
		<p>Fine</p>
		<p>Walked in gdn. Marie Beaumont drove over to a mountain village, with fine views of snow capped mountains. A Russian exil, Mrs. Vera came to dine and played the piano enchantingly. Feeling much better.</p>

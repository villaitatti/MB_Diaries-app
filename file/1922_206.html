		<p>Saturday, July 1, 1922</p>
		<p>Karin</p>
		<p>Naima</p>
		<p>Got so fully packed that I was rather at a loss for occupation!!</p>
		<p>Nicky and the Anreps came to dine</p>
		<p>Aunt Janet came to lunch looking very handsome, but complaining as usual of poverty and the lack of <u>room</u> and the hatefulness of Aubrey Waterfield</p>

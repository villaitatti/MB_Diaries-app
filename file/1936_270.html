		<h3>Tuesday, September 8, 1936, 16 Fitzharding Street</h3>
		<p>Barbara</p>
		<p>Mrs. Digby to do Sea? Work -so efficient and helpful!</p>
		<p>Alys came</p>
		<p>BB and Nicky arrived at 10 p.m. crossing from Rotterdam</p>
		<p>They looked very well.</p>
		<p>I was glad to see them!!</p>
		<p>But I saw them through a mist of pain.</p>

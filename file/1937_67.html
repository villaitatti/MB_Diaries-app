		<p>Thursday, February 18, 1937, I Tatti</p>
		<p>Ralph Sybil Colefax Miss Aldrich</p>
		<p>H. Coster to lunch. I felt very ill.</p>
		<p>Miss Aldrich arrived at 5.40</p>
		<p>Cecil came to dinner to keep her with the List of Villas she is preparing for the American Academy.</p>
		<p>I had to go to bed at once after dinner.</p>

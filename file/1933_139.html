		<h3>Saturday, September 9, 1933, Consuma</h3>
		<p>Karin Christopher</p>
		<p>Developed high fever and severe rheumatic pain. The world blotted out.</p>
		<h3>Sunday, September 10, 1933, Consuma</h3>
		<p>Turned out to be a fresh outburst of the abcess in my groin. Gigholi came up. Got gradually better.</p>

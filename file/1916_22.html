		<h3>Sunday, January 16, 1916, I Tatti</h3>
		<p>Julia, Geoffey Scott, Cecil, Pinsent, Naima Löfroth</p>
		<p>6 lunch, 6 dinner</p>
		<p>Julia and Gordon lunched at Villa Medici. B.B. and Nardies had a walk, and I picked up Julia and had tea at the Actons, and then called on Mrs. Ross and Lina.</p>

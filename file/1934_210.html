		<p>Thursday, July 12, 1934</p>
		<p>Morra</p>
		<p>Perry</p>
		<p>Quiet day for me as Dr. Giglioli gave me a puncture of Edwenil. It did not provoke a fever, but he advised rest.</p>
		<p>BB and Ralph went to see Strong and Santayana. Strong seems to have lost most of his money.</p>
		<p>McComb came to dine.</p>

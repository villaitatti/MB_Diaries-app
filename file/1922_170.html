		<h3>Friday, May 26, 1922</h3>
		<p>{straddling both pages} I Tatti</p>
		<p>The Perrys</p>
		<p>Not feeling well, but attended to lots of letters and things</p>
		<p>Mr. Otto Kahn and Mrs. Joshua came to dinner, also Baron Anrep. It was deliciously warm and we sat out.</p>

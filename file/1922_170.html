		<p>Friday, May 26, 1922</p>
		<p>I Tatti</p>
		<p>The Perrys</p>
		<p>Not feeling well, but attended to lots of letters and things</p>
		<p><u>Mr</u>. Otto Kahn and <u>Mrs</u>. Joshua came to dinner, <u>also</u> Baron Anrep. It was deliciously warm and we sat out.</p>

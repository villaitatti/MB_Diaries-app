		<p>Friday, 27 March, 1936, I Tatti</p>
		<p>Morra, Barbara</p>
		<p>Pain and weakness</p>
		<p>Alas, Alys writes that Logan’s periodical depression is setting in.</p>
		<p>Pellegrina and Gamba to lunch. I did not see them, nor Morra either. It is a great exertion to me to talk.</p>

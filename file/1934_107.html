		<h3>Saturday, March 31, 1934</h3>
		<p>Fine.</p>
		<p>Naima</p>
		<p>The Haselts came to lunch and were very pleasant. BB and I called on Strong, who seemed to us far from well, poor man, and confessed to being very dull and bored. Went over my Sacred Pictures w. BB in the evng.</p>

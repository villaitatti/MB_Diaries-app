		<h3>Monday, 27 January, 1936</h3>
		<p>Rain</p>
		<p>Alberti</p>
		<p>Got up to lunch and dinner, but felt far from well. Alberti read us a French story by the author of “les Thibauts”, and we had a great discussion on incest and found out from the Encyclopedia that it has been a criminal offence in England only since 1908!</p>

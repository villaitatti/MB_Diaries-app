		<p>Saturday, February 4, 1922</p>
		<p>Wadi Halfa and down the river</p>
		<p>Up at 5.30 to ride out behind Wadi Halfa and see the <i>sunrise</i>. Sanderson and Wahrlich came with us.</p>
		<p>The rest of the day was spent going up the river amid those grand cliffs and inconceivable scenery.</p>

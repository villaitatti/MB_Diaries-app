		<h3>Sunday, October 14, 1923</h3>
		<p>Beau Site</p>
		<p>Paris</p>
		<p>Fine</p>
		<p>At last I got out, to motor to Salomon Reinach’s in Martha Hyde’s car. She brought us back.</p>
		<p>She said that before the decree nisi is granted in France the pair are shut into a room with a divan for ½ an hour -- and they often come out reconciled!!</p>

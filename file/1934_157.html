		<h3>Sunday, May 20, 1934</h3>
		<p>Heavenly day. Ray and Karin laying the foundations of the new house Ray and Xtofer are building. Karin read me her lecture and I undertook to finish it.</p>
		<p>Mascha von Heiratz is dead. Another 10 I have remembered but they have sunk into oblivion again. 1428-1438.</p>

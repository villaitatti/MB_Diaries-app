		<h3>Monday, April 2, 1934</h3>
		<p>Scirocco and little rain.</p>
		<p>Countess Gravina came to lunch, dignified and dumm as usual, going on about Goethe and Shakespeare and Houston Chamberlain and Bayreuth. M. and Mrs. Inglefield came to tea. He a budding architect, just married. She not at all stupid.</p>

		<p>Thursday, November 7, 1935, I Tatti</p>
		<p>Rainy</p>
		<p>Mrs. Pickman</p>
		<p>Mrs. Pickman (Hector) is a really charming and delightful person. She had a walk with BB; then I took her to Lina’s as she thinks of sending her girls to the Waterfield to school.</p>
		<p>I feel awfully ill and depressed, aching in every muscle.</p>

		<h3>Saturday,  February 27, 1926</h3>
		<p>I Tatti</p>
		<p>Logan</p>
		<p>Judith</p>
		<p>Morra</p>
		<p>Cecil</p>
		<p>Alda</p>
		<p>Naima</p>
		<p>Still glorious</p>
		<p>B.B. and I had a nice walk.</p>
		<p>Judy has a high temperature and has gone to bed.</p>
		<p>Logan and I went to the tailors, and B.B. took Nicky a drive.</p>

		<p>Sunday, 17 May, 1936, I Tatti</p>
		<p>Sunny</p>
		<p>Morra, Alberti</p>
		<p>Called on Lina and the Van Rensselaer Lees, very flat alas. I was a little in love with Lina and now it has all gone and I’ve taken no pleasure at all in seeing her. Morra came with me.</p>
		<p>Lord Allenby dead. Forgot Mrs. Sutt ‘s daughter (1923)</p>

		<p>Monday, February 5, 1934, I Tatti</p>
		<p>Cold and windy</p>
		<p>Trevy</p>
		<p>Giglioli still calls my attack “benign”. Soit!</p>
		<p>Nesta and the Levi’s came to lunch and Doro Levi remained on for tea. Interesting conversation about Judo-Greeks, Cretans, Basques and Etruscans.</p>

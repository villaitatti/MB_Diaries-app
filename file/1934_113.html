		<p>Friday, April 6, 1934</p>
		<p>Morra</p>
		<p>My old enemy leaped out upon me at 3 in the morning, so I stayed in bed all day. But by camomile steamings and WARMTH I got it under. Spent day over the List. Mr. and Mrs. Osgood and Harry Coster came to lunch and a pairful of Toesca’s to tea.</p>

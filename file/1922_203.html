		<h3>Wednesday, June 28, 1922</h3>
		<p>Karin</p>
		<p>Cecil</p>
		<p>{beginning about a fourth of the way down the page}</p>
		<p>With Karin and Nicky we drove to San Donato and round by the river[.] Italy is unbelievably beautiful.</p>

		<h3>Tuesday, January 26, 1937, I Tatti</h3>
		<p>Cloudy</p>
		<p>Morra, Trevy Khuens</p>
		<p>Byba Khuen still ill.</p>
		<p>I feel very ill also, but struggled up to lunch and to take a drive, and came down to dinner.</p>
		<p>Read Maurice Baring’s excellent introduction to the “Oxford Book of Russian Poetry”</p>

		<h3>Tuesday, January 9, 1934</h3>
		<p>Fine</p>
		<p>I had to go to the lawyer about my will. BB and Nicky called on Steinmann, who is still in bed. The Miss Broadwoods came to tea. The old one of 80 is the juiciest. The other emits commonplaces with great emphasis.</p>

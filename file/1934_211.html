		<p>Friday, July 13, 1934</p>
		<p>Scirocco</p>
		<p>Morra</p>
		<p>Perry</p>
		<p>A fearfully limp day. In the evening Ralph brought his son, Bernard, to dine and w. him a yng couple from Roanoke, W. Virginia, naimed Snowaller. The evng was very dull but us [or we?] liked yng Bernard much more than us liked his brother, Barton.</p>

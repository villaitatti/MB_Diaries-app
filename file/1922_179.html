		<p>Sunday, June 4, 1922</p>
		<p>Perrys</p>
		<p>Ill in bed</p>
		<p>Countess Serristori came to tea and I saw Sophie a bit. The Loesers came and Mr. Vanderlip, the Banker, fresh from Genoa</p>
		<p>Mr. and Mrs. Hallowell (of the New Republic) dined. BB liked him awfully!</p>

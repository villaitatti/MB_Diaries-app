		<p>Friday, 29 May, 1936</p>
		<p>Scirocco then fine</p>
		<p>Morra</p>
		<p>3 people from Padua came to tea. Claricini Ornpacher and 2 daughters. He is head of the opera al the Santo.</p>
		<p>BB and Nicky dined at the De Filippi’s and I had the Van Rensselaer Lees to dine w. me. I like them.</p>

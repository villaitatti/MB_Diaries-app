		<h3>Monday, September 10, 1923</h3>
		<p>Garden Square</p>
		<p>Fine</p>
		<p>Before breakfast walk.</p>
		<p>Came up from Buckhurst with nice Emery Walker.</p>
		<p>Barbara and Berticella arrived at 3.30. Trevy and Busey called.</p>
		<p>Barbara is too darling. She shares my room.</p>

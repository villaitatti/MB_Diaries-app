		<h3>Sunday, July 22, 1934, Consuma</h3>
		<p>All the month I was in desperate pain. Apparently neuritis of the bladder I could barely come out of my sack. Desmond MacLagan came on the 7th Desmond and Desmond has just gone.</p>
		<p>MacLagan came for 4 days. Ralph Perry stayed a month. We did not make much</p>

		<h3>Thursday, September 21, 1933, I Tatti</h3>
		<p>Sola</p>
		<p>Scirocco</p>
		<p>Hands left after lunch. I have relapsed and am very uncomfortable.</p>
		<h3>Friday, September 22, 1933, I Tatti</h3>
		<p>Scirocco very heavy</p>
		<p>Mrs. Holstein came to tea. Alda and I both thought she was horrid.</p>

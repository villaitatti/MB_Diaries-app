		<h3>Thursday, July 27, 1922</h3>
		<p>{straddling both pages} Kissingen</p>
		<p>B.B. walked with Mrs. Lanier and I wandered lonely like the rhinoceros, but enjoyed my climb up the Stationsweg</p>
		<p>Orchestral concert in evening with Mrs. Lanier and her nice young musician friend, Dirch [sic] Foch.</p>

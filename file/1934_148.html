		<p>Friday, May 11, 1934</p>
		<p>Glorious</p>
		<p>Edith</p>
		<p>Cte and Ctesse de Mem and Mdlle de Vallombrose were brought by Placci for tea. The Barlows and Aubrey Waterfield also came.</p>
		<p>Quiet evening of bookish chat.</p>
		<p>In the morning went w. Edith to the Gamberaia and was shown all round by Baroness von Ketteler.</p>

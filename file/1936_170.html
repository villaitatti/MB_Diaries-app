		<h3>Sunday, 31 May, 1936</h3>
		<p>Morra</p>
		<p>Russo and his wife came to lunch. In the evening I read 3 chapters of my “Vicarious Trip to the Barbary coast” to BB and Morra and they really liked it!</p>
		<p>Forgot Mr. and Mrs. Richards, Dr. Hartshorne and Kate Shipley. (1945)</p>

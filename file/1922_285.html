		<h3>Monday, September 18, 1922</h3>
		<p>Turfan again, nice Dr. de Kok Coq {also written above the line for more clarity} a combination of Horne and Claude Phillips.</p>
		<p>In the evening we went to the En[t]führung aus dem Serail which was lovely. We liked it better than Così fan tutti.</p>

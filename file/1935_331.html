		<p>Sunday, November 10, 1935, I Tatti</p>
		<p>Naima Morra</p>
		<p>Lovely day and drive to the “Tree” that would have been enchanting were it not for the dark veil of neurasthenia that darkens the beauty of the world from my eyes.</p>
		<p>Forgot Mr. and Mrs. Burt of Fernhust (1618)</p>

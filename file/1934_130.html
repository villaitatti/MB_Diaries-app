		<p>Monday, April 23, 1934</p>
		<p>Rain. Cold. Fire in library</p>
		<p>To tea Mr and Mrs Myron Taylor brought by Ernesta, Miss Mitchell, Cecil Anrep. … Freeman (Mrs. Berenson’s friend) and her horrible young companion whose name I’ve forgotten. Very mixed pickles.</p>
		<p>Got another fifty dollars for poor Lockoff.</p>

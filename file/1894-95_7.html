		<p>But the  great event is that Miss Paget thinks Bernhard has made a great, great discovery in aesthetics, and has spurred him to commencing a book on Scientific Art Criticism — a book which, she prophesies, will make its mark. <this paragraph marked with a red line in the left margin></p>

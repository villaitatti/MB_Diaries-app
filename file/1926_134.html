		<h3>Tuesday, May 4, 1926</h3>
		<p>Fine</p>
		<p>Museum</p>
		<p>At 3 went with Sen. Orsi and Prof. Agati to “La Cuba” (scarcely worth seeing but a lovely drive) and then back to Euryalus. Orsi’s harsh voice and insistent talk (but we like him) rather shattered the ineffable Stimming of the ruins and the view.</p>

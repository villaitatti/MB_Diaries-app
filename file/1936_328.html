		<p>Thursday, November 5, 1936</p>
		<p>Glorious</p>
		<p>Got up for lunch, meaning to go out, but was seized with colic and had to creep back to bed.</p>
		<p>The Beaumonts came in the afternoon and were very pleasant.</p>
		<p>Kind act. Gave tray and cups to Filippo.</p>

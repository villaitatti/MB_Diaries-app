		<h3>Monday, March 11, 1935, I Tatti</h3>
		<p>Cold and cloudy Tramontana</p>
		<p>Costers, Shapleys and Anthony lo lunch</p>
		<p>Shapleys and Byba come to see me.</p>
		<p>Pane to dine</p>
		<p>Suida to tea</p>
		<p>I am taking soppositories of morphine and they keep me quiet and __ __ such a blessing</p>

		<p>Thursday, 30 January, 1936, I Tatti</p>
		<p>So so.</p>
		<p>Began milk diet. I would do anything to get even a little better. Got up for tea to receive the Miss Broadwoods, who are disintegrating into old age without much to redeem them.</p>
		<p>Roger angelic.</p>
		<p>Began “Guy Mannering”.</p>

		<p><b>Friday, May 21, 1926</b></p>
		<p>Villa Igiea</p>
		<p>Palermo</p>
		<p>Cloudy</p>
		<p>Stayed in feeling very wretched, but got out to see La Cuba and <u>La Ziza</u> with Valenti (Sept. Architect) and signora and <u>Castelmaurigi</u>, with whom we went back and had tea.</p>

		<h3>Sunday, February 11, 1934</h3>
		<p>Grey</p>
		<p>Cecil</p>
		<p>Naima</p>
		<p>Finished Chap. X (Feb.-Aug. 1891) and read it to BB who found it just right-to my great joy! He says I am developing a real style!! Pity? Waited till 70 to do it.</p>
		<p>Mrs. Hulton came to lunch, empathic and worthless.</p>

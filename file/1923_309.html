		<h3>Sunday, October 21, 1923</h3>
		<p>Beau Site</p>
		<p>Paris</p>
		<p>Rain</p>
		<p>We spent Sunday in the rain at Chartres along with Royal Tyler.</p>
		<p>Lady Colefax came to dine.</p>
		<p>It was a wonderful day in spite of the rain, and in spite of feeling wretchedly ill.</p>

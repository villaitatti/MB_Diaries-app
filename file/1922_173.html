		<h3>Monday, May 29, 1922</h3>
		<p>In bed</p>
		<p>but able to read various books on Egypt and look at illustrations with pleasure.</p>
		<p>I made the mistake of getting up for dinner when Mr. Perkins, Secretary of the American Embassy, and his mother and father came to dinner.</p>

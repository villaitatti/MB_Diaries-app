		<h3>Saturday, December 23, 1933, I Tatti</h3>
		<p>Glorious</p>
		<p>But I had my (fortunately last!) vaccine in the morning.</p>
		<p>Cecil Anrep came to lunch.</p>
		<p>My fever higher than ever.</p>
		<p>An awful night!</p>
		<h3>Sunday, December 24, 1933, I Tatti</h3>
		<p>Fever</p>

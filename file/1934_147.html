		<h3>Thursday, May 10, 1934</h3>
		<p>Fine</p>
		<p>Edith</p>
		<p>Truelle left. Edith out all day. I went w. her to the Costers, and met the Baroness Von Ketteler. In evening read aloud Logan’s Preface to his “Golden Shakespeare” and garnered up their criticism.</p>

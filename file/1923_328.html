		<h3>Thursday, November 8, 1923</h3>
		<p>Palace Hotel Milan</p>
		<p>Fine</p>
		<p>It was very hard to leave Barbara, but I took the train at 10:35, and got to Milan at 6:15.</p>
		<p>Guido Cagnola met me, and I went to dine with them. Anita is very sweet and lovable, but one must not expect conversation!</p>
		<p>This is Friday</p>

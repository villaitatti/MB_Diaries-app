		<h3>Saturday, January 5, 1935, I Tatti</h3>
		<p>Karin</p>
		<p>Got so awful tired helping Karin and Ann choose shoes, that I could hardly hold out for the rest of the day.</p>
		<p>Saw Pinsent and Morra for a few minutes each.</p>
		<p>BB walked chiefly with Ann, whom he likes very much. She is a remarkable sweet creature.</p>

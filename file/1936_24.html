		<h3>Monday 6 January, 1936, I Tatti</h3>
		<p>Ojetti to lunch, but I went out. (He tires me. And had a pleasant lunch with Fern Strapley at the Villino.</p>
		<p>Ciarletta and Cecil Anrep to tea. I did not get up. This is Tuesday.</p>
		<p>Doro Levis and Pane to lunch.</p>

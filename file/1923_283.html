		<h3>Wednesday, September 26, 1923</h3>
		<p>42 Garden Square</p>
		<p>Harris took us to see Lascelles pictures, a horrid job lot. He has been fearfully “done” by Borenius!</p>
		<p>Mrs. Crawshay came to lunch. Nicky went to stay with the Trevys and B.B and I dined, most pleasantly, with the Rothensteins.</p>
		<p>Went to Duveens.</p>

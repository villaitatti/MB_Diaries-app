		<h3>Tuesday, January 23, 1934 Hyères</h3>
		<p>Grey</p>
		<p>Quiete day, with 2 walks for now. Unfortunately my rheumatism has rushed back into my knees, the “drainage” having ceased. Each step requires an effort of will.</p>
		<p>Went on w. Phineas Redux. Norton reads very well.</p>

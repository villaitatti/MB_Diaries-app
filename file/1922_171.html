		<h3>Saturday, May 27, 1922</h3>
		<p>Naimi</p>
		<p>Suddenly stricken down with severe bladder pain. I hope it isn’t going to be cystitis. If I thought it would be like my last attack (9 months) I should kill myself at once. The pain is bestial, and breaks down one’s nerves.</p>
		<p>B.B. had various people.</p>

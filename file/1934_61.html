		<p>Tuesday, February 13, 1934</p>
		<p>Fine</p>
		<p>Trevy</p>
		<p>The De Marinis, Maria Caselli, Pancrazi and Russo to lunch. I came in afterwards. It tired me.</p>
		<p>To tea Shapleys, Paoluccis, Levi, Mr. and Mrs. Epstein (Chicago) I put in a word for Lockoff and got awfully tried/tired.</p>

		<p>Monday, 3 February, 1936 T Tatti</p>
		<p>So so.</p>
		<p>Went to drive with BB but felt most awfully ill-such pain!</p>
		<p>However, managed to get up to dinner (tho not to eat it) and read to BB Lewissohn’s view of the eternally unsolved Jewish Question.</p>
		<p>Nicky still in bed.</p>

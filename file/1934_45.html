		<h3>Sunday, January 28, 1934 La Primavera, San Remo</h3>
		<p>Pleasant quiet day, with a beautiful drive to see a picturesque hill-town, ruined, but rendered ineffably romantic by earthquake. Another awful evening of sleepiness while Marie read on and on and on!</p>

		<p>Sunday, 19 January, 1936</p>
		<p>Rain</p>
		<p>Naima</p>
		<p>Placci and Franchi (a young writer) came to lunch. I got up, tho’ feeling pretty ill.</p>
		<p>Finished “Cossack Girl”. Too dreadful.</p>
		<p>Heard of Benghene’s death, who I knew at St. Moritz (1882).</p>

		<h3>Friday, Oct. 11, 1907</h3>
		<p>Fine.</p>
		<p>Scott, Rothenstein.</p>
		<p>A fearfully sad letter from poor Karin, who got quite deaf when she went up to Newnham. I was upset, horribly, and cried all day.</p>
		<p>Placci and Buonamici and Albert and his mother spent the afternoon.</p>

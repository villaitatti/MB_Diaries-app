		<h3>Saturday, 25 January, 1936, I Tatti</h3>
		<p>Grey</p>
		<p>Roger better, but sadly thinned down and hardly able to walk.</p>
		<p>Cecil Pinsent came to dine and Mrs. Shapley. We talked about Greece. It was very pleasant.</p>
		<p>Finished reading aloud “Red gauntlet”.</p>

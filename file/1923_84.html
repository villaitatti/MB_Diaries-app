		<h3>Saturday, March 17, 1923</h3>
		<p>Fine</p>
		<p>Naima</p>
		<p>5 Forbes, Johnny Waterfield, Cecil and Yashiro to lunch. I hope Forbes will get a job for Yashiro. It was delightful in the stanzone after lunch with the 3 children playing about.</p>
		<p>Went to town for errands and called on from Miss. Paterson</p>
		<p>Trevy came to dine</p>

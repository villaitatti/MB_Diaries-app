		<p>Friday, April 26, 1935, I Tatti</p>
		<p>Miss Lowenfeld</p>
		<p>Giglioli came and said my pain had become “chronic”, and no one knew how to cure it.</p>
		<p>I must take and hand myself.</p>
		<p>Up to now I have felt that I had an illness. This last bout makes me feel that I am ill…a very great difference, alas.</p>

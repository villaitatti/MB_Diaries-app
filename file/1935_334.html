		<h3>Wednesday, November 13, 1935, I Tatti</h3>
		<p>Fine</p>
		<p>Morra</p>
		<p>Doro and Anna Levi came to lunch</p>
		<p>I was very tired.</p>
		<p>I called on Lina in the afternoon, taking Roger.</p>
		<p>Hortense and Cecil Anrep came to tea. O how all this uninformed talk about the Wad bores me!</p>

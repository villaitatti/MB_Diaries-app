		<p>Wednesday, November 29, 1922</p>
		<p>Fine</p>
		<p>Cold and dark</p>
		<p>Worked.</p>
		<p>{<i>4 skipped lines</i>}</p>
		<p>Mrs. Dumont sent us <u>their</u> sub-consul at Frankfort, a Mr. Lawrekky such a <u>chiel</u> little man!! who dined here. We bore it with exhaustion.</p>

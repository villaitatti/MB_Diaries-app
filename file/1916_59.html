		<h3>Monday, February 21, 1916, Paris</h3>
		<p>Feeling very ill, worse.</p>
		<p>Weissmann came. He says I can leave on Saturday only.</p>
		<p>I sent off his letter about Nikky which he read to me. Very wise and sincere but goodness I think it will be of no use at all when they meet.</p>

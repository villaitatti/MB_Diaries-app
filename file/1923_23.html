		<h3>Wednesday, January 17, 1923</h3>
		<p>Fine</p>
		<p>Desmond</p>
		<p>Nicky</p>
		<p>Miss Paget came to lunch and she and B.B. outdid themselves in glittering lies of a general nature.</p>
		<p>Children went to town and then climbed on the roof and played in the garden while Ray and I watched them.</p>
		<p>Nicky returned at 6 am. Dear thing.</p>

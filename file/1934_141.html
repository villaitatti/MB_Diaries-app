		<h3>Friday, May 4, 1934</h3>
		<p>Rain.</p>
		<p>Winlock</p>
		<p>No one for lunch! I went to town - I came back to find Mrs. Tuttle, McIvor, the Barlows and Miss Matthews for tea. They stayed till 7.</p>
		<p>Decided to leave on the 16th for London and began to clean up the “Life of BB” and my psychoanalytical papers.</p>

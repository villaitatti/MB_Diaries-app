		<h3>Monday, June 18, 1934, London</h3>
		<p>Hot</p>
		<p>Ray came in from Fernhurst. She said she did not hear one reasonable word from Barbara or Toby during all the weekend.</p>
		<p>Miss Caton-Thompson and a German Jewess Sanskrit scholar to tea.</p>
		<p>Desmond to dine.</p>

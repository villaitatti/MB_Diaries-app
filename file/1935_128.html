		<h3>Sunday, April 21, 1935, I Tatti</h3>
		<p>Cloudy</p>
		<p>Barbara and Roger</p>
		<p>A very painful afternoon. Nothing seems to relieve the irritation, which is at the mouth of the vagina. Opiates make it easier to bear, but they are so be-dulling</p>
		<p>Vavalà came and lunched with me. She is in a pretty bad way financially.</p>

		<p>I went up to see my Fiesolan Villa, and afterwards joined him at Fiesole where we dined.</p>
		<p>We walked down together and had a beer at Gilli and Letta’s.</p>
		<p>He has made me resolve to learn German.</p>
		<p>Saturday, June 2, 1894, Florence</p>

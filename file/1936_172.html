		<p>Tuesday, June 2, 1936</p>
		<p>Fine but cold</p>
		<p>Morra</p>
		<p>Felt very weaker but managed to get up for lunch and dinner and also to work on my “Vicarious Trip”.</p>
		<p>The Serlupi and a painter from Trieste named Rietti [Arturo Q3624584](sent by Croce) came to tea, but I did not see them</p>

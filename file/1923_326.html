		<h3>Tuesday, November 6, 1923</h3>
		<p>Ecole Nouvelle</p>
		<p>La Pelouse</p>
		<p>Vaud Bex</p>
		<p>Switzerland</p>
		<p>Left at 8:20 and reached Bex at 8:40! Motored up to the School and found Barbara--the darling!--in her nightgown, jumping up with joy to see me.</p>
		<p>This is Wednesday.</p>

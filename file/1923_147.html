		<p>Thursday, May 17, 1923</p>
		<p>Nauplia</p>
		<p>Orde Bretagne</p>
		<p>Scirocco</p>
		<p>but glorious sunset</p>
		<p>Quiet day resting. Sailed in afternoon.</p>
		<p>Had broken-hearted letter from Guido Cagnola, whose wife is slowly fading. He cares for nothing else in life and means to retire from the world when she is gone.</p>

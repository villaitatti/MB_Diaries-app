		<h3>Sunday, Oct. 11, 1908</h3>
		<p>Lilac leaves from Walt Whitman’s “door yard”.</p>
		<p>Grace and I motored in Mr. Cannon’s motor to Huntington and had lunch with Mrs. Vollmer and her bedulling sister, on a farm they are running.</p>
		<p>We had tea with Mrs. Bacon at Sunken Meadow.</p>

		<h3>Wednesday, May 16, 1923</h3>
		<p>Nauplia</p>
		<p>Orde Bretagne</p>
		<p>Andritsaina to Nauplia - *The view at sunset crossing the Pass to reach the Bay of Angoris is divine.</p>
		<p>B.B. and I quarrelled fiercely about the name and place of a snow mountain. Unfortunately I was right, but I might have let it alone.</p>

		<h3>Friday, November 15, 1935, I Tatti</h3>
		<p>Colder grey</p>
		<p>Morra</p>
		<p>Pellegrina ans Moravia to lunch</p>
		<p>Nicodemi and Mme Helfer to tea, but for them I did not get up</p>
		<p>Forgot Presbitero, Herman Melville, Mrs. Codman, J.P. Morgan, Carl Sprague of Buffalo, and Mrs. Barclay with whom we stayed as children.</p>

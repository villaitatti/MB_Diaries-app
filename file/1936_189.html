		<h3>Friday, June 19, 1936</h3>
		<p>Lady McClure</p>
		<p>Delightful guests. He is so very well informed, has such broad views, and is so cultivated. She is pretty and very sweet and they enclose each other.</p>
		<p>The De Filippi came to lunch and the Waterfield to dinner.</p>

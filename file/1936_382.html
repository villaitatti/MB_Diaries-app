		<h3>Tuesday, December 29, 1936</h3>
		<p>A little warmer but still grey</p>
		<p>The Lapoukhines, Trocca, the Levis, Placci to dine.</p>
		<p>Madame Lapoukhine sang. It was somehow just like a run through an old fashioned Anglo-American-Continental novel</p>
		<p>The Romaninos came to tea. I did not get up.</p>

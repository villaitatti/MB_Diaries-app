		<h3>Monday, August 6, 1923</h3>
		<p>Fine</p>
		<p>Baths, walked to the Grüner baum for coffee.</p>
		<p>We walked out now, as prescribed, to the Bauerhof for morning coffee, ½ hour each way, and most lovely is the early morning through the fragrant pine woods.</p>
		<p>I am having Diathermy for my lame arm.</p>

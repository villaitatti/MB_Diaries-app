		<h3>Saturday, Aug. 31, 1907</h3>
		<p>Explored the town and had a bath.</p>
		<p>Bernhard lunched with the Princesse Lynar (née Parsons of Columbus, Ohio), the Trabias and Placci. At 3.30 the Shillers came to tea.</p>
		<p>Placci and he dined with Dora to meet the Birrels.</p>

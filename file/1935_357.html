		<p>Friday, December 6, 1935, I Tatti</p>
		<p>Cold</p>
		<p>Still ill alas.</p>
		<p>Anna Levi and Nesta to lunch. I saw each one a few minutes</p>
		<p>Roger cut his 5° tooth</p>
		<p>A little better and went to the Library in the evening.</p>
		<p>Forgot Barrett Wendell, john Chipman Gras, the musician Löffler 1655</p>

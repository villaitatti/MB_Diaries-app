		<p>Friday, January 13, 1922</p>
		<p>Glorious</p>
		<p>Cairo—</p>
		<p>Went on the Mokattam with Patricolo and <u>saw</u> El Juyushi (mosque) and the marvelous view.</p>
		<p>In the evening he took us to Ibn Tulun by moonlight. Perhaps the most wonderful experience of all.</p>
		<p>Cresswell [<i>sic</i>] and Alfred Nicholson called.</p>

		<h3>Friday, January 13, 1922</h3>
		<p>Glorious</p>
		<p>Cairo—</p>
		<p>Went on the Mokattam with Patricolo and saw El Juyushi (mosque) and the marvelous view.</p>
		<p>In the evening he took us to Ibn Tulun by moonlight. Perhaps the most wonderful experience of all.</p>
		<p>Cresswell [sic] and Alfred Nicholson called.</p>

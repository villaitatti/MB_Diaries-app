		<h3>Saturday, 1 February, 1936, I Tatti</h3>
		<p>So so</p>
		<p>Naima</p>
		<p>When Roger came in all dressed for going out, I could not believe that such a lovely little apparition was mine!</p>
		<p>Drove out w. BB. In evening read a story in the “Atlantia” by a man named Geoffrey Household. Rather good.</p>
		<p>Nicky laid up w. a cold.</p>

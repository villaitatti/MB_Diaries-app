		<h3>Sunday, 1 March, 1936</h3>
		<p>Naima</p>
		<p>---- This is February 23, I think</p>
		<p>Cecil came to dine. He is going to Greece just for his expenses, as the King has no money! He is to advice about rebuilding the Castello at Tatoi. I gave him letters to Prof Shell and Miss Kalopathakes.</p>

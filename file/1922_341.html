		<p>Monday, November 13, 1922</p>
		<p>Fine</p>
		<p>Had a walk with B.B. and one of our quietest talks about the matters we feel most passionate or sore about. We are <i>so</i> different, there hardly could be two people who are such poles apart in their instincts.</p>

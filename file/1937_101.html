		<p>Wednesday, March 24, 1937, I Tatti</p>
		<p>Cold and fine</p>
		<p>Ralph and Judith Lady Berwick</p>
		<p>Teresa Berwick came to tea and spend the night.</p>
		<p>Lina and Mr. __ and Miss Russell (his niece) came with her</p>

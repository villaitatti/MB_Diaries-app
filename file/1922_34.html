		<p>Tuesday, January 10, 1922</p>
		<p>Cairo</p>
		<p>Up but not out.</p>
		<p>Creswell, Mme. Bazil, Elgoods, Patricolo, Mme. de Sérionne called. B.B. dined with Col. Thompson and Maurice Amos. N. and I dined alone and she began to learn the type writer.</p>
		<p>Rained, nearly <u>snowed</u> at night.</p>

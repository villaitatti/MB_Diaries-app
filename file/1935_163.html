		<h3>Sunday, May 26, 1935, I Tatti</h3>
		<p>Morra Roger Walker</p>
		<p>Barbara arrived for lunch seemingly recovered. She is intelligent!</p>
		<p>The 2 doctors came, but had nothing to suggest. Dr. Panà gave me one of those black “instillations”, but its calming effect lasted only 3 hours.</p>

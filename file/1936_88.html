		<h3>Tuesday, 10 March, 1936, I Tatti</h3>
		<p>Fine</p>
		<p>March 3</p>
		<p>Quiet day but the pain jumped back on me in the evening and I had a dreadful night.</p>
		<p>BB and Nicky arrived for dinner. Heavenly to see them again, tho’ the fatigue of talking to them gave me a bad night.</p>
		<p>Forgot Mr. and Mrs. Kenworthy-Brown. (1876)</p>

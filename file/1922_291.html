		<p>Sunday, September 24, 1922</p>
		<p>Cold</p>
		<p>Picture gallery—Karin and Adrian lunch</p>
		<p>Went in afternoon to Potsdam, and loved the architecture, but it was cold and crowded. Still we saw it.</p>
		<p><s>Went with K. and A. to</s></p>
		<p>Friedländer dined with us.</p>
		<p>Went in to see the modern pictures</p>
		<p>rather struck by Marc’s animals.</p>

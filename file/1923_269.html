		<h3>Wednesday, September 12, 1923</h3>
		<p>42 Garden Square</p>
		<p>Fine</p>
		<p>National gallery in morning. Miss Alexandra to tea and Mr. Strong, who thoroughly admires Mussolini’s beau geste !!!! It is sickening.. Charley Bell also came to tea.</p>
		<p>Barbara and Berticella got off at 9 and I went to have breakfast with Alys.</p>

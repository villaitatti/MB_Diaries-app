		<p>Wednesday, January 2, 1935, I Tatti</p>
		<p>The Stephens have lots of work to do here. It is well, for I have very better strength for talking.</p>
		<p>Lunch: Nesta de Roebeck, who came up to see me.</p>
		<p>Tea: Mr. Panost to see me, and Dobski and his boy to have tea with BB</p>

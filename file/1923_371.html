		<h3>Thursday, December 20, 1923</h3>
		<p>I Tatti</p>
		<p>Busy all morning with architect and plans to make Colombo a store-house, etc.</p>
		<p>Stein and a horribly conceited friend of his named Einstein came to lunch tea, and the Mathers with their boy. I began to feel ill De Nicola also came.</p>

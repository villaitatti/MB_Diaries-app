		<h3>Monday, July 24, 1934</h3>
		<p>of his boy Bernard. Pellegrina came for 4 days. Then Clotilde and boy had many visits from Hortense Serristori, Riri Visconti and Elena Casini, but I was scarcely well enough to see them.</p>

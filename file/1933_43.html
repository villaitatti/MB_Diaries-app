		<h3>Sunday, March 5, 1933, I Tatti</h3>
		<p>Rain</p>
		<p>Naima lunched here</p>
		<p>B.B. and I went on with Asia Minor</p>
		<h3>Monday, March 6, 1933, I Tatti</h3>
		<p>Rainy</p>
		<p>Poor old Stiebel to lunch</p>
		<p>B.B. and Nicky dined at De Filippis’.</p>
		<p>Aubrey and Kinta and Cecil and Jim Flexner dined with me</p>

		<p>13 February, 1936, I Tatti</p>
		<p>Cold and fine</p>
		<p>Alda returned from Rome. Rezia Corsini and Maria Teresa Ricasoli came to tea.</p>
		<p>I had to take a double dope of Aceticen to be able to receive them.</p>
		<p>Barbara says I musn’t write to Toby till the divorce is over.</p>

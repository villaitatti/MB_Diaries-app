		<h3>Monday, September 24, 1923</h3>
		<p>42 Garden Square</p>
		<p>Ray arrived in morning from Geneva and Paris.</p>
		<p>I went to the Conways, Allington Castle, Maidstone, with Karin for tea and dinner.</p>

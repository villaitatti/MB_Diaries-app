		<h3>Wednesday, October 17, 1934</h3>
		<p>Fine</p>
		<p>feeling very weak and ill, too ill to see anyone or dictate any letters. Placci came to lunch and had a walk; Pellegrina to tea and Mr. Van Marle for an endless seance. Ann’s chemistry professor said she sometimes suspected Ann was a genius!</p>

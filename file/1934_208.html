		<h3>Tuesday, July 10, 1934</h3>
		<p>Hot but possible</p>
		<p>Morra</p>
		<p>Ralph Perry</p>
		<p>McComb came to lunch- Nesta to tea bring Mrs. Levi, Placci and Lapiccirella to done. Ralph arrived. He said he looked instinctively for a letter from Rachel, when his mail was handed to him.</p>

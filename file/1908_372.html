		<h3>Tuesday, Dec. 15, 1908</h3>
		<p>The Deanery, Bryn Mawr.</p>
		<p>Johnsons in morning.</p>
		<p>Lunched with Mrs. Kirkbride and Dr. and Mrs. Anderson (he a brain specialist at work in Wistin Institute).</p>
		<p>Came in again with Carey to dine with Mr. Johnson.</p>

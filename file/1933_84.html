		<h3>Thursday, May 25, 1933, I Tatti</h3>
		<p>Compare with 24th. A muddle!</p>
		<h3>Friday, May 26, 1933, I Tatti</h3>
		<p>Cold. Rain</p>
		<p>Costers, Smiths, Cooper, Temple, Signora Porzio to lunch. Went to Santa Trinità to hear XIII Laudi. Crowd, rain, discomfort, and the music disappointing. B.B. and I came away early.</p>

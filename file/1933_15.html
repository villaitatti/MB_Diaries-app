		<h3>Monday, January 8, 1933, I Tatti</h3>
		<p>Trevy</p>
		<p>John Robertson dead.</p>
		<p>Telegraphed and wrote to Maud.</p>
		<p>Called on Strong and had a very pleasant hour and a half with him.</p>
		<p>Went on with Genji.</p>
		<h3>Tuesday, January 9, 1933, I Tatti</h3>
		<p>Trevy</p>
		<p>Clean and cold</p>
		<p>Aubrey to dine</p>

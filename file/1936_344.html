		<h3>Saturday, November 21, 1936</h3>
		<p>Fine</p>
		<p>Truelle</p>
		<p>Wharton</p>
		<p>Truelle arrived at 6. I like him so much. He is being moved from the Vatican to the Quai d’Orsay.</p>
		<p>Drove BB and Nicky to Fiesole and BB paid a long call on Sybil, who has at last let Percy go ⎬Friday</p>
		<p>for a holiday!</p>

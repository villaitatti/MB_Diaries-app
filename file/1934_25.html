		<p>Monday, January 8, 1934</p>
		<p>Fine-ish</p>
		<p>Cecchi and a new publisher came to tea to talk over the Italian ed. of BB’s works. Trevy also came with his latest flame, the sculptress, Miss Minz. They stayed on to dine and Cecil Pinsent came. It was quite pleasant.</p>

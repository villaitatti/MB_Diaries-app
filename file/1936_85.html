		<p>Saturday, 7 March, 1936, I Tatti</p>
		<p>Beautiful</p>
		<p>This is Mar 1</p>
		<p>Day of pain. Took too much acetem and was bedrelled with the thing.</p>
		<p>Roger tried to use a spoon to feed himself!</p>
		<p>A little better, but still very ill.</p>
		<p>Poor little Roger again crying w. his teeth.</p>

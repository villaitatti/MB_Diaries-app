		<h3>Wednesday, March 3, 1915, I Tatti</h3>
		<p>Fine, colder</p>
		<p>Mr. Benn and Miss Paterson came to lunch. I took the latter to call on Mrs. Ross and Miss Erichsen.</p>
		<p>Had a walk with BB. He dined with Sybil and Geoffrey and I dined here. He feels low with his influenza. Talked of Nikky and grew more cheerful.</p>

		<p>Thursday, March 7, 1935, I Tatti</p>
		<p>Snowing cloudy</p>
		<p>Byba Khuen lunch. She came to see me. Her long illness has broken the beautiful creature.</p>
		<p>Miss Hiley to tea. I like her.</p>
		<p>Fern looked in.</p>
		<p>I felt awfully ill and discouraged.</p>

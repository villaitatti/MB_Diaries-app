		<p>Tuesday, May 21, 1935, I Tatti</p>
		<p>Cold sunny</p>
		<p>Morra Roger</p>
		<p>Felt awfully ill, could not even read., French also</p>
		<p>Fiamma Sergardi came to lunch bringing a Mr. Brian. French with Staude also came and took a walk with BB.</p>
		<p>O I feel so ill</p>
		<p>I forgot Prof. Toy and Norton. Miss Norton, Miss. Nathurst (1543)</p>

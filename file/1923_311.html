		<h3>Tuesday, October 23, 1923</h3>
		<p>Beau Site</p>
		<p>Paris</p>
		<p>Louvre with Marthe Hyde to see the Egyptian things with the Curator M. Boreux. Very wonderful things, and quite well exposed.</p>
		<p>Went to see Manship’s bust and all is improved.</p>
		<p>The Manships dined here. He is very engaging.</p>

		<h3>Saturday, July 29, 1922</h3>
		<p>{straddling both pages} Kissingen</p>
		<p>Drove to Meiningen, a charming little Residentzstaat [sic], and saw again the collection of Italian pictures that excited us so much 25 years ago when we came with Herbert Horne. Alas, now rather flat and uninspired. Tout change!</p>

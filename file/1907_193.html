		<h3>Thursday, June 20, 1907</h3>
		<p>Hot.</p>
		<p>Finished my tiresome article for the Gazette. B.B. finished his on Girolamo di Giovanni da Camerino.</p>
		<p>He went to town to see Horne.</p>
		<p>I watched the girls swim. They went in without bathing-dresses.</p>
		<p>Finished St Francis and his Companions (Macdonell).</p>

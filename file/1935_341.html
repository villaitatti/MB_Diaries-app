		<p>Wednesday November 20, 1935, I Tatti</p>
		<p>Mr. and Mrs. Paul Douglas of Chicago came to lunch</p>
		<p>Miss Ann Watsen (Yale scholar) to tea</p>
		<p>(both up: This was Thursday)</p>
		<p>I sat in the sun with Roger in the <i>stanzone</i> from 12-1.</p>
		<p>Hortense and Doro Levi came to lunch.</p>

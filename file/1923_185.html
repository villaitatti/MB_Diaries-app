		<p>Saturday, June 23, 1923</p>
		<p>Arthur, Jessie, Jimmy and another Jessie Berenson.</p>
		<p>Town for shopping. Called on Mrs. Ross and asked her to go to England with me.</p>
		<p>The Berenson party came up to tea and Bernard took them on (a) walk. They all less awful than I feared.</p>

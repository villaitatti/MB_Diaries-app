		<h3>Sunday, February 18, 1934, I Tatti</h3>
		<p>Glorious</p>
		<p>BB and I quite to ourselves went on with Rhys Carpenter. I drove out with him and finished “Josephus” while he had his walk.</p>
		<p>Princess Mary of Turn and Taxis has died. But she had an interesting life.</p>

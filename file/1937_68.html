		<p>Friday, February 19, 1937, I Tatti</p>
		<p>Fine</p>
		<p>Ralph Miss Aldrich</p>
		<p>Felt ill but worked with Miss Aldrich on her List of Villas.</p>
		<p>Placci to lunch. We all drove out to Gricigliato to show Miss Aldrich the villa</p>
		<p>Finished “Sacrifice to Attis” by Brend. A   third class __ well meant.</p>

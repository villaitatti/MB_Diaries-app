		<p>September 8, 1895, Chartres</p>
		<p>We spent the day chiefly in the Cathedral, of which we admired the inner façade most. The choir is trivial, but the opening out of the transept very grand.</p>
		<p>We talked of course, endlessly.</p>
		<p>September 9, 1895, Grand Hotel de Blois, Blois</p>

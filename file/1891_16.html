		<p>* Wednesday, August 17 , 1892, Hotel du Grand Cerf, Nantes</p>
		<p>I was surprisingly well, and we went about to see the sights, the Cathedral and St. Ouen, the back of which outside we particularly enjoyed, 〈and〉 the Musée, where we found a Longhi</p>

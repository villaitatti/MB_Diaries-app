		<p>Tuesday, September 11, 1923</p>
		<p>42 Garden Square</p>
		<p>Fine</p>
		<p>Shopping all morning with Barbara. We got the coat she dreamed of at Nicoll’s, a raglan boy’s coat.</p>
		<p>I went with B.B. to have the cyst removed from his cheek. It was skilfully [sic] done, without pain.</p>
		<p>We dined with the Witts.</p>

		<p>Tuesday, June 9, 1936</p>
		<p>Rain</p>
		<p>De Filippei and Nesta came to lunch</p>
		<p>Guido and Emilia Mantegazza left at 3. The Shapley and Castelfranco came to tea and Cecil Pinsent to dine. Felt very uncomfortable ill night till 4 a.m.</p>
		<p>Forgot Mary Fabbri and Natalie Antinori 1498</p>

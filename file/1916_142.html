		<h3>Tuesday, June 6, 1916, Grand Hotel, Rome</h3>
		<p>Went to Pinacoteca Vaticana.</p>
		<p>Lunched with Placci.</p>
		<p>Motored with Mrs. Strong and Mr. Brooks to Ostia and dined at Torre Constantino.</p>
		<p>When we got back, we heard of Lord Kitchener’s death.</p>

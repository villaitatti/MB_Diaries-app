		<p>Monday, September 7, 1936, 16 Fitzharding  Street</p>
		<p>Barbara</p>
		<p>Packing and coming to town. It tired me a good dicto and the luxury and comfort here are most delicious!</p>
		<p>Alys was here to meet me.</p>
		<p>Barbara, rather ill, came to rest and get well.</p>

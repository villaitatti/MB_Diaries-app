		<p>Tuesday, August 22, 1922</p>
		<p>Big Chilling</p>
		<p>Alys Logan me, Sarah, Salvemini</p>
		<p>Took Salvemini to see some cottages. Guido wrote that Anita simply <i>wouldn</i><i>’</i><i>t</i> have a nurse. One pays for marrying an unintelligent woman! But—anyhow—one pays sooner or later.</p>
		<p>B.B. and Nicky in Munich with Jo Duveen.</p>

		<p>Tuesday, February 27, 1934</p>
		<p>Pouring</p>
		<p>The Sanminiatellis and Delfino Cinelli and Maria Caselli came to lunch-painfully noisy!</p>
		<p>Gamba came to tea. Not noisy enough for he is deaf and BB would not raise his voice.</p>
		<p>I sent off my “Across the Mediterranean” to Carey.</p>

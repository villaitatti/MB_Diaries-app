		<h3>Tuesday, March 9, 1937, I Tatti</h3>
		<p>Rain</p>
		<p>Ralph Judith</p>
		<p>Mr. and Mrs. Allyn Cox left at 3.</p>
		<p>The Bossi-Puccis came to dine. She says she now awfully wants another (4°) baby – he said she would have to find another father, as 3 children were quite enough for him.</p>

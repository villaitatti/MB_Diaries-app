		<p>Saturday, November 14, 1936</p>
		<p>Rain</p>
		<p>Naima</p>
		<p>Pain, but so much happiness from Roger. He pulls me out of bed asking “Come here” and if I am almost fainting with pain</p>
		<p>I love to come</p>
		<p>Alda and Bertie to tea</p>
		<p>The new butler came. He seems very nice</p>

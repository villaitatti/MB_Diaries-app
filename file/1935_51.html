		<p>Sunday, February 3, 1935, I Tatti</p>
		<p>Fine</p>
		<p>Trevy Cecil</p>
		<p>Quiet pleasant day.</p>
		<p>The Velzeys came to lunch. I had a long talk with her.</p>
		<p>Also with Cecil, and then with Jane Morison who came with us.</p>
		<p>Shapleys to dine.</p>

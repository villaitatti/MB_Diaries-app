		<h3>Monday, April 15, 1935, I Tatti</h3>
		<p>Barbara and Roger Morra Ray</p>
		<p>Barbara gives out – a real break down. We shall put her at the Blue Nuns at Fiesole.</p>
		<p>Lina shipped and broke her lip. The Misericordia carried her to the Orthopedic hospital</p>
		<h3>Van Derlip died March 16 (1533)</h3>

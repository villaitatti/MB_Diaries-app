		<p>Tuesday, 4 Feb, I Tatti</p>
		<p>So so</p>
		<p>Roger dancing and laughing and playing tricks. He threw all the shoes out of the window this morning. Fell too ill to go out but after reading to BB in the evening had an hour of physical comfort. So rare!</p>
		<p>Ray’s great Federation dinner.</p>

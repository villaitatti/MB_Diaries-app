		<h3>Saturday, September 8, 1923</h3>
		<p>Fine</p>
		<p>Buckhurst</p>
		<p>Ray who spent the night before going to Geneva to attend the League of Nations sitting.</p>
		<p>I went to Buckhurst, the Benson’s lovely place, in the afternoon. -- the motorist arrived for dinner.</p>

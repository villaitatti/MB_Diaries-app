		<p>Wednesday, March 27, 1935, I Tatti</p>
		<p>Lovely</p>
		<p>Helbig</p>
		<p>Little Roger too heavenly this morning. He comes down to be fed at 6, and laughs and cries till he goes to sleep.</p>
		<p>Byba Khuen to tea and walk. She came to see me along with Helbig.</p>

		<p>Wednesday, January 18 (?), 1934</p>
		<p>Fine</p>
		<p>Drove to the Balsanis with Alys and Grace. Thought the chateau hideous in its heavy coarse mediaevalism. The grounds are well kept and well laid out, but not interesting, tho’ the cypresses make a fine effect.</p>

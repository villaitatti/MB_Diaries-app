		<h3>Monday, May 13, 1907</h3>
		<p>Enchantment.</p>
		<p>All the young people swam and played about while we watched.</p>
		<p>Dr. Giglioli and Dr. Heath had a consultation over me, and rather scared me about my general health.</p>
		<p>Albert Spalding stayed to lunch — a delightful boy, so clever and talented.</p>

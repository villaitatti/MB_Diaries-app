		<h3>Tuesday, June 1, 1926</h3>
		<p>Grand Hotel</p>
		<p>Naples</p>
		<p>Misty</p>
		<p>Went to S. Chiara, S. Paolo, S. Lorenzo with Ortolani and De Rinaldis. The Nun’s cloister (XVIII) at S. Chiara is a paradise. Fine XIII Tomb in S. Lorenzo. I love the gay theatrical interior of S. Chiara.</p>

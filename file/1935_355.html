		<h3>Wednesday, December 4, 1935, I Tatti</h3>
		<p>Rainy</p>
		<p>3 Pickmans</p>
		<p>Too ill to notice anything. Could hardly read Perry’s “Life of William James”</p>
		<p>BB and Hester Pickman arrived at Villa Medici, but Sybil was too ill to see them.</p>

		<p>Thursday, November 14, 1935, I Tatti</p>
		<p>Morra</p>
		<p>I went to town to the dressmakers’, weeping over her sun in Abyssinia – her  empty, her trade destroyed.</p>
		<p>B ___ the Coras, Tancredi to lunch but I did not go down. Italian talk is too loud for me to endure.</p>
		<p>BB   called on Byba Khuen</p>
		<p>Quiet evening</p>

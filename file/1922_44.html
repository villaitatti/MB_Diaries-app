		<p>Friday, January 20, 1922</p>
		<p>On the Nile</p>
		<p><i>Assiout</i></p>
		<p>Rather a wasted day from the point of view of art: but we had a very wonderful view of the town from the hills behind, and also of the Nile valley. But to think they don’t stop at Til el-Amarna!!! Stupid <u>Cooks</u>! It turned very cold in the night.</p>

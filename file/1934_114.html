		<p>Saturday, April 7, 1934</p>
		<p>Only so-so. Coldish</p>
		<p>Evelina Osten-Sacksen came to lunch and had a walk with BB and Nicky. I felt better in the mng and got a lot of work done on the Lists, but gradually got rather worse. Bladder bothered me.</p>
		<p>Went on with the Talleyrand as BB and I were alone.</p>

		<h3>Sunday, May 12, 1935, I Tatti</h3>
		<p>Fine</p>
		<p>Morra</p>
		<p>(this for May 5)</p>
		<p>Went to see Barbara. She seemed better. The place is lovely.</p>
		<p>I had to pay heavily for my outing.</p>
		<p>Morra arrived for dinner.</p>
		<p>Can’t remember</p>

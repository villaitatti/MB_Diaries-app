		<p>Monday, April 3, 1922</p>
		<p>Went to Lady Duff Gordon’s grave which I have had put in order. Museum with Kitsons and Philomène, which was a bore. Spent afternoon at citadel. Went to Mikado in evening.</p>
		<p>The Kitsons lunched here.</p>
		<p>Eliza is packing.</p>

		<h3>Sunday, September 24, 1916, I Tatti</h3>
		<p>Geoffrey Scott, Cecil Pinsent</p>
		<p>Index-making. Walked.</p>
		<p>Mr. and Mrs. Dumonts, Mrs. Ross and Hutton, Mr. and Mrs. Arbuthout dined here, also Cecil.</p>
		<p>Geoffrey had Marcella and her aunt Cornelia Fabbricotti to dine.</p>

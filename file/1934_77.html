		<h3>Thursday, March 1, 1934</h3>
		<p>Mixed</p>
		<p>No one to lunch! Went to dentist and dressmaker. BB and Nicky to see some restored pictures at Vermehren’s.</p>
		<p>Elizabeth says if you say “Rabbits” the first thing on Mar. 1st you will get a lot of money in the month!</p>

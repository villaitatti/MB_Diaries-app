		<h3>Saturday, June 13, 1936</h3>
		<p>Fine at last!</p>
		<p>Naima</p>
		<p>I went to lunch with the Shapleys and enjoyed it. They came to tea, which we had on the terrace.</p>
		<p>Fiorella shared Roger bath. They did enjoy it!</p>
		<p>Went on with “Prince Otto”</p>

		<h3>Tuesday, February 29, 1916, I Tatti</h3>
		<p>Cecil Pinsent, Naima Löfroth</p>
		<p>(Thunderstorm)</p>
		<p>Reached home about 6.</p>
		<p>B.B arrived an hour earlier. It is nice to be here.</p>
		<p>The new Library looks splendid - the Buddha is very impressive seen at the end of my corridor.</p>

		<p>Wednesday, 22 January, 1936</p>
		<p>Fine</p>
		<p>Poor little mite! He moaned and cried all day with his eye-teeth. It wracked my heart and nerves.</p>
		<p>B---- and Marie Lou Stucchi came to lunch. I was too ill to go down.</p>
		<p>Pellegrina came to have a walk with BB and looked in to see me.</p>
		<p>Poor little Rogerino!</p>

		<h3>Thursday, Aug. 27, 1908</h3>
		<p>Gave dinner to Kelly, Tom Spring-Rice, Scott and Bobby Trevy at Dieudonné’s, and we all went in Kelly’s motor to Queen’s Hall to hear “G. Face’s” Symphony (Balfour Gardiner). It was alas boring, but the Debussy L’Après midi d’un Faune was quite enchanting.</p>

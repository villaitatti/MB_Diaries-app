		<p>Saturday, August 25, 1923</p>
		<p>Bad Gastein</p>
		<p>Walks in the pouring rain. I have lost only 4 lbs out of the 20 I must lose.</p>
		<p>The McCormicks dined with us.</p>
		<p>Mrs. Leggett wrote that Storrs (who has married his cousin, Ms. Clowes, a widow with 5 children and not rich!) is “radiantly happy,” so all is well.</p>
